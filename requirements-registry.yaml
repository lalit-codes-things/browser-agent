schema_version: 1
specification: DESIGN-FINAL-LOCKED.md
source_of_truth: requirements-registry.yaml
status_semantics:
  UNVERIFIED: Requirement has no accepted execution evidence yet.
  IMPLEMENTED_UNTESTED: Code exists but relevant tests have not passed.
  TESTED_FAILED: At least one required test failed.
  PASS: The required proof ran on the recorded platform/commit and passed.
  ACCEPTED_LIMITATION: A reviewed, time-bounded deviation exists; critical safety invariants may not be waived.
