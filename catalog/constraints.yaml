ci_lint_rules:
- IDs must be unique and sequential C-01..C-164 unless a future catalog revision explicitly adds stable IDs.
- spec_status and verification_status must use the declared vocabularies.
- Every LOCKED entry must have a named test_id and at least one owner phase.
- No PROPOSED entry may be referenced as release-blocking by any Phase 0–7 gate.
- Every named Revision-2 constraint mapping must resolve bidirectionally to existing catalog IDs.
- value_defined=false must fail/flag when the owner phase of the parameter has started, unless an explicit ADR records the
  missing value and its owner.
- Every depends_on/supersedes/amends reference must resolve to a catalog ID, parameter ID, or explicit revision-history token.
- PRs touching src-tauri/src/core/policy/** must reference at least one affected C-ID.
- C-10 must retain both tier-FN and irreversible-as-reversible class-FN coverage; neither surface may silently drop from the
  gate.
