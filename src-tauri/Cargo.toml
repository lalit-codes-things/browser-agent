[package]
name = "browser-agent"
version = "0.1.0"
edition = "2021"
description = "Local-first browser agent runtime"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "browser_agent_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
parking_lot = "0.12"
unicode-normalization = "0.1"
password-hash = { version = "0.5", features = ["argon2"] }


[profile.release]
opt-level = 3
lto = true
strip = true
