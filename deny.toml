# Supply-chain policy for the Rust workspace (Section 20.10).
# Run with: cargo deny check

[graph]
all-features = false
# The CEF FFI crate is only built when the native host is assembled explicitly.
exclude-dev = false

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
# Permissive licenses only. Anything else needs a reviewed exception here.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Wildcard requirements are denied for anything from a registry, which is where
# an unpinned version is a real supply-chain risk. The only wildcard requirements
# in this workspace are first-party crates linked by path (`ba-domain.workspace =
# true`), which are `publish = false` members of this repository and are pinned
# by the workspace lockfile, so they are allowed by path.
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # No generic HTTP control servers in the production core (Section 14.2).
  { name = "tiny_http" },
  { name = "warp" },
  { name = "actix-web" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
